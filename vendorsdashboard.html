
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Dashboard - LocalVibe</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="vendorsdashboard.css">
</head>

<body>

    <header>
        <nav class="top-nav">
            <h2>♥ LocalVibe</h2>

            <a href="index.html">Home</a>
            <a href="vendorsdashboard.html">Dashboard</a>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <div class="dashboard" id="vendorDashboard">

        <div class="sidebar">
            <h2>Vendor Panel</h2>

            <a href="#overview">Dashboard</a>
            <a href="#products">My Products</a>
            <a href="#orders">Orders</a>
            <a href="#store">Store Details</a>
            <a href="#addproduct">Add Product</a>
            <a href="#" id="vendorLogout">Logout</a>
        </div>

        <div class="content">

            <div class="welcome" id="overview">
                <h1 id="vendorWelcome">Welcome!</h1>
                <p>Manage your store and products with LocalVibe.</p>
            </div>

            <div class="section" id="store">
                <h2>My Store Details</h2>
                <p><b>Store Name:</b> <span id="vendorStoreName"></span></p>
                <p><b>Owner Name:</b> <span id="vendorOwnerName"></span></p>
                <p><b>Email Address:</b> <span id="vendorEmailDetail"></span></p>
                <p><b>Phone Number:</b> <span id="vendorPhoneDetail"></span></p>
                <p><b>Store Location:</b> <span id="vendorLocationDetail"></span></p>
            </div>

            <div class="section" id="addproduct">
                <h2>Add New Product</h2>

                <form>
                    <label>Product Name</label>
                    <input type="text" placeholder="Enter product name" required>

                    <label>Product Price</label>
                    <input type="number" placeholder="Enter price" required>

                    <label>Product Quantity</label>
                    <input type="number" placeholder="Enter quantity" required>

                    <button type="submit">Add Product</button>
                </form>
            </div>

        </div>
    </div>

    <script src="profile.js"></script>
</body>
</html>
